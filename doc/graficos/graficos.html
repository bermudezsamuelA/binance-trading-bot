<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gráficos de trading</title>
<style>
  :root {
    color-scheme: light;
    --surface: #fcfcfb;
    --page: #f9f9f7;
    --ink: #0b0b0b;
    --ink2: #52514e;
    --muted: #898781;
    --border: rgba(11, 11, 11, 0.10);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--page);
    color: var(--ink);
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  main { max-width: 992px; margin: 0 auto; padding: 32px 16px; display: grid; gap: 24px; }
  header h1 { font-size: 22px; margin: 0 0 4px; }
  header p { margin: 0; color: var(--ink2); font-size: 14px; }
  figure {
    margin: 0;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 20px 24px 18px;
    width: 960px;
    max-width: 100%;
  }
  figure h2 { font-size: 17px; font-weight: 600; margin: 0 0 4px; }
  figure .sub { font-size: 13.5px; color: var(--ink2); margin: 0 0 14px; line-height: 1.4; }
  svg { display: block; width: 100%; height: auto; overflow: visible; }
  svg text { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
  .legend { display: flex; flex-wrap: wrap; gap: 6px 18px; margin-top: 10px; font-size: 12.5px; color: var(--ink2); }
  .legend span { display: inline-flex; align-items: center; gap: 7px; }
  .k-line { width: 16px; height: 0; border-top: 2px solid; border-radius: 2px; }
  .k-dash { width: 16px; height: 0; border-top: 2px dashed; }
  .k-box { width: 11px; height: 11px; border-radius: 3px; }
  .k-dot { width: 9px; height: 9px; border-radius: 50%; }
  .k-tri { width: 0; height: 0; border-left: 6px solid transparent; border-right: 6px solid transparent; border-bottom: 10px solid; }
  .note { font-size: 12px; color: var(--muted); margin-top: 8px; }

  body.shot { background: var(--surface); overflow: hidden; }
  body.shot main { padding: 0; max-width: none; gap: 0; display: block; }
  body.shot header { display: none; }
  body.shot figure { border: none; border-radius: 0; }
</style>
</head>
<body>
<main id="app">
  <header>
    <h1>Gráficos de la introducción al trading</h1>
    <p>Datos simulados con fines didácticos. Cada figura se exporta como imagen a <code>doc/img/</code>.</p>
  </header>
</main>
<pre id="measure" hidden></pre>
<script>
const C = {
  surface: '#fcfcfb', ink: '#0b0b0b', ink2: '#52514e', muted: '#898781',
  grid: '#e1e0d9', axis: '#c3c2b7',
  blue: '#2a78d6', orange: '#eb6834', aqua: '#1baf7a', yellow: '#eda100',
  violet: '#4a3aa7', red: '#e34948', up: '#1baf7a', down: '#e34948',
};
const W = 912;
const FONT = 'system-ui, -apple-system, &quot;Segoe UI&quot;, sans-serif';

// ---------- utilidades ----------
function rng(seed) {
  return function () {
    seed |= 0; seed = seed + 0x6D2B79F5 | 0;
    let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
function gauss(r) {
  return () => { let u = 0; while (!u) u = r(); return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * r()); };
}
const sc = (d0, d1, r0, r1) => v => r0 + (v - d0) * (r1 - r0) / (d1 - d0);
function nice(min, max, n = 5) {
  const span = max - min || 1;
  let step = Math.pow(10, Math.floor(Math.log10(span / n)));
  const err = span / n / step;
  if (err >= 7.5) step *= 10; else if (err >= 3.5) step *= 5; else if (err >= 1.5) step *= 2;
  const lo = Math.floor(min / step) * step, hi = Math.ceil(max / step) * step;
  const ticks = [];
  for (let v = lo; v <= hi + step * 1e-6; v += step) ticks.push(+v.toFixed(8));
  return { lo, hi, ticks };
}
const num = (v, d = 0) => {
  const s = Math.abs(v).toFixed(d);
  const [i, f] = s.split('.');
  const g = i.replace(/\B(?=(\d{3})+(?!\d))/g, ' ');
  return (v < 0 ? '−' : '') + g + (f ? '.' + f : '');
};
function S(tag, a, inner) {
  let s = '<' + tag;
  for (const k in a) if (a[k] !== undefined && a[k] !== null && a[k] !== false) s += ` ${k}="${a[k]}"`;
  return inner === undefined ? s + '/>' : s + '>' + inner + '</' + tag + '>';
}
const line = (x1, y1, x2, y2, stroke, w = 1, ex = {}) => S('line', { x1, y1, x2, y2, stroke, 'stroke-width': w, 'stroke-linecap': 'round', ...ex });
function txt(x, y, s, o = {}) {
  return S('text', {
    x, y, 'font-size': o.size || 12, fill: o.fill || C.ink2, 'text-anchor': o.anchor || 'start',
    'font-weight': o.weight, 'font-variant-numeric': o.tab ? 'tabular-nums' : undefined,
    'paint-order': o.halo ? 'stroke' : undefined, stroke: o.halo ? C.surface : undefined,
    'stroke-width': o.halo ? 5 : undefined, 'stroke-linejoin': o.halo ? 'round' : undefined,
    transform: o.rotate ? `rotate(${o.rotate} ${x} ${y})` : undefined,
  }, s);
}
const pathD = pts => pts.map((p, i) => (i ? 'L' : 'M') + p[0].toFixed(1) + ' ' + p[1].toFixed(1)).join(' ');
const poly = (pts, color, w = 2, ex = {}) => S('path', { d: pathD(pts), fill: 'none', stroke: color, 'stroke-width': w, 'stroke-linejoin': 'round', 'stroke-linecap': 'round', ...ex });
const dot = (x, y, color, r = 5) => S('circle', { cx: x, cy: y, r, fill: color, stroke: C.surface, 'stroke-width': 2 });
const arrowDefs = () => S('defs', {}, S('marker', { id: 'ah', viewBox: '0 0 10 10', refX: 9, refY: 5, markerWidth: 7, markerHeight: 7, orient: 'auto-start-reverse' }, S('path', { d: 'M0 0 L10 5 L0 10 z', fill: C.ink2 })));
const arrow = (pts, ex = {}) => S('path', { d: pathD(pts), fill: 'none', stroke: C.ink2, 'stroke-width': 1.5, 'marker-end': 'url(#ah)', 'stroke-linejoin': 'round', ...ex });

// Marco de un panel: cuadrícula horizontal, etiquetas del eje Y y línea base.
function panel(o) {
  const { x0, x1, y0, y1, yMin, yMax, yFmt = v => num(v), yTicks = 5, fixed } = o;
  const nk = nice(yMin, yMax, yTicks);
  const lo = fixed ? yMin : nk.lo, hi = fixed ? yMax : nk.hi;
  const ys = sc(lo, hi, y1, y0);
  let g = '';
  for (const v of nk.ticks) {
    if (v < lo - 1e-9 || v > hi + 1e-9) continue;
    const yy = ys(v);
    g += line(x0, yy, x1, yy, C.grid, 1);
    g += txt(x0 - 8, yy + 4, yFmt(v), { anchor: 'end', fill: C.muted, tab: true });
  }
  g += line(x0, y1, x1, y1, C.axis, 1);
  return { ys, g, lo, hi };
}
function swings(v, k, type) {
  const out = [];
  for (let i = k; i < v.length - k; i++) {
    const win = v.slice(i - k, i + k + 1);
    const ext = type === 'min' ? Math.min(...win) : Math.max(...win);
    if (v[i] === ext && (!out.length || i - out[out.length - 1] > k)) out.push(i);
  }
  return out;
}
function toOHLC(path, size) {
  const out = [];
  for (let i = 0; i + size <= path.length - 1; i += size) {
    const seg = path.slice(i, i + size + 1);
    out.push({ o: seg[0], h: Math.max(...seg), l: Math.min(...seg), c: seg[seg.length - 1] });
  }
  return out;
}
function candles(ohlc, xs, ys, bodyW) {
  let g = '';
  ohlc.forEach((k, i) => {
    const x = xs(i), col = k.c >= k.o ? C.up : C.down;
    g += line(x, ys(k.h), x, ys(k.l), col, 1.5);
    const top = ys(Math.max(k.o, k.c)), bot = ys(Math.min(k.o, k.c));
    g += S('rect', { x: x - bodyW / 2, y: top, width: bodyW, height: Math.max(1.5, bot - top), rx: Math.min(2, bodyW / 4), fill: col });
  });
  return g;
}

// ---------- datos simulados ----------
const g1 = gauss(rng(11));
const W64 = [...Array(64).keys()];
const UP = W64.map(x => 100 + 0.45 * x + 3.2 * Math.sin(x / 2.6) + 0.4 * g1());
const DOWN = W64.map(x => 130 - 0.45 * x + 3.2 * Math.sin(x / 2.6) + 0.4 * g1());
const RANGE = W64.map(x => 100 + 5 * Math.sin(x / 2.8) + 0.5 * g1());

const g2 = gauss(rng(7));
const PATH = [100];
for (let i = 0; i < 260; i++) PATH.push(PATH[i] + (i < 150 ? 0.12 : -0.10) + 0.7 * g2());

const g3 = gauss(rng(5));
const BOLL = [];
{ let p = 100; for (let i = 0; i < 90; i++) { p += 0.10 * (100 - p) + 0.55 * g3(); if (i === 55) p -= 3.2; BOLL.push(p); } }

function equity(pWin, seed, b = 2, n = 100) {
  const r = rng(seed); let cap = 100; const out = [cap];
  for (let i = 0; i < n; i++) { cap += r() < pWin ? b : -1; out.push(cap); }
  return out;
}
function pickEquity(pWin) {
  const exp = 100 + 100 * (pWin * 2 - (1 - pWin));
  let best = 0, bestD = Infinity;
  for (let s = 1; s < 400; s++) { const d = Math.abs(equity(pWin, s).at(-1) - exp); if (d < bestD) { bestD = d; best = s; } }
  return equity(pWin, best);
}
const EQ_A = pickEquity(0.42), EQ_B = pickEquity(0.30);

// ---------- figuras ----------
const FIGS = [];
const fig = (id, title, sub, h, render, legend = [], note = '') => FIGS.push({ id, title, sub, h, render, legend, note });

// 1. Horizontes del trading
fig('estilos', 'Cuánto dura una operación según el estilo', 'Escala logarítmica: cada marca multiplica el tiempo. La franja naranja es donde opera este bot.', 250, () => {
  const x0 = 150, x1 = W - 12, top = 36, rowH = 42;
  const lx = v => x0 + Math.log10(v) / Math.log10(1.6e8) * (x1 - x0);
  const ticks = [[1, '1 s'], [60, '1 min'], [3600, '1 h'], [86400, '1 día'], [604800, '1 semana'], [2.63e6, '1 mes'], [3.156e7, '1 año']];
  const rows = [
    ['Scalping', 'segundos a minutos', 5, 900],
    ['Day trading', 'minutos a horas', 300, 86400],
    ['Swing trading', 'días a semanas', 86400, 2.4e6],
    ['Inversión', 'meses a años', 5.2e6, 1.6e8],
  ];
  const yAxis = top + rows.length * rowH + 4;
  let g = S('rect', { x: lx(60), y: 18, width: lx(43200) - lx(60), height: yAxis - 18, fill: C.orange, opacity: 0.12, rx: 4 });
  g += txt((lx(60) + lx(43200)) / 2, 12, 'Este bot: de minutos a horas', { anchor: 'middle', size: 12.5, fill: C.ink, weight: 600 });
  for (const [v, l] of ticks) { g += line(lx(v), 18, lx(v), yAxis, C.grid, 1); g += txt(lx(v), yAxis + 18, l, { anchor: 'middle', fill: C.muted }); }
  g += line(x0, yAxis, x1, yAxis, C.axis, 1);
  rows.forEach(([name, desc, a, b], i) => {
    const y = top + i * rowH + rowH / 2;
    g += txt(0, y - 2, name, { size: 13.5, fill: C.ink, weight: 600 });
    g += txt(0, y + 14, desc, { size: 12, fill: C.muted });
    g += S('rect', { x: lx(a), y: y - 8, width: lx(b) - lx(a), height: 16, rx: 4, fill: C.blue });
  });
  return g;
});

// 2. Anatomía de un par
fig('par', 'Cómo se lee un par de trading', '“BTCUSDT = 60 000” significa que 1 bitcoin cuesta 60 000 USDT.', 190, () => {
  let g = '';
  const y = 70;
  g += txt(195, y, 'BTC', { size: 58, fill: C.ink, weight: 650, anchor: 'middle' });
  g += txt(278, y, '/', { size: 58, fill: C.muted, anchor: 'middle' });
  g += txt(380, y, 'USDT', { size: 58, fill: C.ink, weight: 650, anchor: 'middle' });
  g += txt(495, y, '=', { size: 58, fill: C.muted, anchor: 'middle' });
  g += txt(630, y, '60 000', { size: 58, fill: C.ink, weight: 650, anchor: 'middle', tab: true });
  const br = (a, b, title, desc, color) => {
    const yy = 92, m = (a + b) / 2;
    return S('path', { d: `M${a} ${yy} V${yy + 10} H${b} V${yy}`, fill: 'none', stroke: color, 'stroke-width': 2.5, 'stroke-linejoin': 'round', 'stroke-linecap': 'round' })
      + line(m, yy + 10, m, yy + 20, color, 2.5)
      + txt(m, yy + 42, title, { anchor: 'middle', size: 14, fill: C.ink, weight: 600 })
      + txt(m, yy + 62, desc, { anchor: 'middle', size: 12.5, fill: C.ink2 });
  };
  g += br(137, 253, 'Activo base', 'lo que compras', C.blue);
  g += br(310, 450, 'Moneda de cotización', 'con qué pagas (≈ 1 dólar)', C.orange);
  g += br(535, 725, 'Precio', 'USDT por cada 1 BTC', C.aqua);
  return g;
});

// 3. Libro de órdenes
fig('libro', 'El libro de órdenes de BTC/USDT', 'Arriba, quienes quieren vender (asks); abajo, quienes quieren comprar (bids). El precio vive en el hueco entre ambos.', 325,
() => {
  const asks = [[60040, 0.80], [60030, 1.25], [60020, 0.55], [60010, 0.30]];
  const bids = [[60000, 0.45], [59990, 1.05], [59980, 0.70], [59970, 1.40]];
  const xP = 178, xB = 196, k = 250, rowH = 30, top = 34, gap = 40;
  let g = txt(xP, 16, 'Precio (USDT)', { anchor: 'end', fill: C.muted, size: 12 });
  g += txt(xB, 16, 'Cantidad (BTC)', { fill: C.muted, size: 12 });
  g += line(xB, 26, xB, top + 8 * rowH + gap, C.axis, 1);
  const row = (i, [p, q], color, isAsk) => {
    const y = top + i * rowH + (isAsk ? 0 : 4 * rowH + gap) + rowH / 2;
    const w = q * k;
    return txt(xP, y + 4, num(p, 2), { anchor: 'end', tab: true, fill: C.ink, size: 13 })
      + S('path', { d: `M${xB} ${y - 9} H${xB + w - 4} Q${xB + w} ${y - 9} ${xB + w} ${y - 5} V${y + 5} Q${xB + w} ${y + 9} ${xB + w - 4} ${y + 9} H${xB} Z`, fill: color })
      + txt(xB + w + 8, y + 4, num(q, 2), { tab: true, size: 12.5 });
  };
  asks.forEach((r, i) => g += row(i, r, C.down, true));
  bids.forEach((r, i) => g += row(i, r, C.up, false));
  const yAsk = top + 3 * rowH + rowH / 2, yBid = top + 4 * rowH + gap + rowH / 2;
  g += txt(4, top + 2 * rowH + 4, 'VENDEN', { size: 11.5, fill: C.muted, weight: 600 });
  g += txt(4, top + 4 * rowH + gap + 2 * rowH + 4, 'COMPRAN', { size: 11.5, fill: C.muted, weight: 600 });
  const xa = 600;
  g += line(xa - 120, yAsk, xa - 8, yAsk, C.axis, 1) + txt(xa, yAsk + 4, 'Mejor ask: la venta más barata', { fill: C.ink, size: 13 });
  g += line(xa - 120, yBid, xa - 8, yBid, C.axis, 1) + txt(xa, yBid + 4, 'Mejor bid: la compra más cara', { fill: C.ink, size: 13 });
  const ys = top + 4 * rowH + gap / 2;
  g += S('rect', { x: xB + 1, y: yAsk + 12, width: 380, height: yBid - yAsk - 24, fill: C.yellow, opacity: 0.14, rx: 4 });
  g += txt(xB + 14, ys + 5, 'Spread = 60 010 − 60 000 = 10 USDT', { size: 13, fill: C.ink, weight: 600 });
  return g;
}, [{ k: 'box', c: C.down, l: 'Órdenes de venta (asks)' }, { k: 'box', c: C.up, l: 'Órdenes de compra (bids)' }]);

// 4. Escalera entrada / TP / SL
fig('escalera', 'Una operación completa: entrada, take profit y stop loss', 'Se arriesgan 1 500 USDT por bitcoin para intentar ganar 3 000: la recompensa es el doble del riesgo.', 330, () => {
  const x0 = 64, x1 = W - 200, y0 = 8, y1 = 300;
  const P = panel({ x0, x1, y0, y1, yMin: 58000, yMax: 63500, yTicks: 5 });
  const ys = P.ys;
  const ctrl = [[0, 60000], [0.12, 59700], [0.26, 59050], [0.36, 59400], [0.5, 60500], [0.62, 61200], [0.72, 60900], [0.86, 62300], [1, 63000]];
  const r = gauss(rng(3)); const pts = [];
  const n = 70;
  for (let i = 0; i <= n; i++) {
    const t = i / n; let j = 0; while (ctrl[j + 1][0] < t) j++;
    const [ta, va] = ctrl[j], [tb, vb] = ctrl[j + 1];
    const u = (t - ta) / (tb - ta), s = (1 - Math.cos(Math.PI * u)) / 2;
    let v = va + (vb - va) * s + (i > 0 && i < n ? 110 * r() : 0);
    pts.push([x0 + 10 + t * (x1 - x0 - 50), ys(v)]);
  }
  let g = P.g;
  g += S('rect', { x: x0, y: ys(63000), width: x1 - x0, height: ys(60000) - ys(63000), fill: C.up, opacity: 0.10 });
  g += S('rect', { x: x0, y: ys(60000), width: x1 - x0, height: ys(58500) - ys(60000), fill: C.down, opacity: 0.10 });
  const lvl = (v, color, title, desc) => line(x0, ys(v), x1 + 12, ys(v), color, 2)
    + txt(x1 + 22, ys(v) - 2, title, { size: 13.5, fill: C.ink, weight: 600 })
    + txt(x1 + 22, ys(v) + 15, desc, { size: 12, fill: C.ink2 });
  g += lvl(63000, C.up, 'Take profit · 63 000', 'vendo con ganancia (+3 000)');
  g += lvl(60000, C.ink2, 'Entrada · 60 000', 'compro aquí');
  g += lvl(58500, C.down, 'Stop loss · 58 500', 'vendo con pérdida (−1 500)');
  g += txt(x0 + 14, ys(62300), 'Recompensa = 2 × riesgo', { size: 12.5, fill: C.ink, halo: true });
  g += txt(x0 + 14, ys(58800), 'Riesgo', { size: 12.5, fill: C.ink, halo: true });
  g += poly(pts, C.blue, 2);
  g += dot(pts[0][0], pts[0][1], C.blue, 6) + dot(pts.at(-1)[0], pts.at(-1)[1], C.blue, 6);
  return g;
}, [{ k: 'line', c: C.blue, l: 'Precio' }, { k: 'box', c: C.up, l: 'Zona de ganancia' }, { k: 'box', c: C.down, l: 'Zona de pérdida' }]);

// 5. Anatomía de una vela
fig('anatomia', 'Anatomía de una vela japonesa', 'Cada vela resume cuatro precios de un periodo: apertura, máximo, mínimo y cierre (OHLC).', 372, () => {
  let g = '';
  const draw = (cx, color, up) => {
    const hi = 30, top = 100, bot = 240, lo = 310, bw = 76;
    let s = line(cx, hi, cx, lo, color, 3);
    s += S('rect', { x: cx - bw / 2, y: top, width: bw, height: bot - top, rx: 4, fill: color });
    const labR = (y, a, b) => line(cx + bw / 2 + 8, y, cx + bw / 2 + 40, y, C.axis, 1) + txt(cx + bw / 2 + 48, y - 1, a, { size: 13.5, fill: C.ink, weight: 600 }) + txt(cx + bw / 2 + 48, y + 15, b, { size: 12, fill: C.muted });
    s += labR(hi, 'High · máximo', 'el precio más alto');
    s += labR(top, up ? 'Close · cierre' : 'Open · apertura', up ? 'terminó aquí' : 'empezó aquí');
    s += labR(bot, up ? 'Open · apertura' : 'Close · cierre', up ? 'empezó aquí' : 'terminó aquí');
    s += labR(lo, 'Low · mínimo', 'el precio más bajo');
    const brk = (a, b, label) => {
      const x = cx - bw / 2 - 14;
      return S('path', { d: `M${x + 6} ${a} H${x} V${b} H${x + 6}`, fill: 'none', stroke: C.axis, 'stroke-width': 1.5 })
        + txt(x - 8, (a + b) / 2 + 4, label, { anchor: 'end', size: 12.5 });
    };
    s += brk(hi + 2, top - 3, 'Mecha superior') + brk(top + 3, bot - 3, 'Cuerpo') + brk(bot + 3, lo - 2, 'Mecha inferior');
    s += txt(cx, 362, up ? 'Vela alcista: cerró más arriba de donde abrió' : 'Vela bajista: cerró más abajo de donde abrió', { anchor: 'middle', size: 13, fill: C.ink, weight: 600 });
    return s;
  };
  g += draw(215, C.up, true);
  g += draw(665, C.down, false);
  return g;
});

// 6. Serie de velas con volumen
fig('velas', 'Una serie de velas: subida y retroceso', 'Cada vela agrupa 10 precios consecutivos. Debajo, el volumen negociado en cada vela.', 380, () => {
  const ohlc = toOHLC(PATH, 10);
  const vr = rng(9);
  const vol = ohlc.map(k => 30 + Math.abs(k.c - k.o) * 18 + vr() * 25);
  const x0 = 48, x1 = W - 8;
  const P = panel({ x0, x1, y0: 8, y1: 250, yMin: Math.min(...ohlc.map(k => k.l)), yMax: Math.max(...ohlc.map(k => k.h)), yFmt: v => num(v) });
  const slot = (x1 - x0) / ohlc.length;
  const xs = i => x0 + slot * (i + 0.5);
  let g = P.g + candles(ohlc, xs, P.ys, slot * 0.58);
  const vMax = Math.max(...vol), vy0 = 272, vy1 = 350;
  g += line(x0, vy1, x1, vy1, C.axis, 1);
  g += txt(x0 - 8, vy0 + 10, 'Vol.', { anchor: 'end', fill: C.muted });
  ohlc.forEach((k, i) => {
    const h = (vol[i] / vMax) * (vy1 - vy0);

  });
  return g;
}, [{ k: 'box', c: C.up, l: 'Vela alcista (cierre > apertura)' }, { k: 'box', c: C.down, l: 'Vela bajista (cierre < apertura)' }]);

fig('temporalidades', 'Las mismas 6 horas en velas de 15 minutos y de 1 hora', 'Ambos paneles usan exactamente los mismos precios, de 09:00 a 15:00. Cada vela de 1 hora junta 4 velas de 15 minutos: abre donde abre la primera, cierra donde cierra la última y su mecha llega al máximo y al mínimo de las cuatro.', 312, () => {

// 8–10. Tendencias y rango
function trendFig(id, title, sub, data, kind) {
  fig(id, title, sub, 290, () => {
    const x0 = 44, x1 = W - 8;
    const P = panel({ x0, x1, y0: 8, y1: 270, yMin: Math.min(...data) - 1, yMax: Math.max(...data) + 1 });
    const xs = sc(0, data.length - 1, x0 + 6, x1 - 6);
    let g = P.g;
    if (kind === 'range') {
      const res = Math.max(...data), sup = Math.min(...data);
      g += S('rect', { x: x0, y: P.ys(res), width: x1 - x0, height: P.ys(sup) - P.ys(res), fill: C.orange, opacity: 0.06 });
      g += line(x0, P.ys(res), x1, P.ys(res), C.orange, 2, { 'stroke-dasharray': '6 5' });
      g += line(x0, P.ys(sup), x1, P.ys(sup), C.orange, 2, { 'stroke-dasharray': '6 5' });
      g += poly(data.map((v, i) => [xs(i), P.ys(v)]), C.blue, 2);
      const tops = swings(data, 3, 'max'), bots = swings(data, 3, 'min');
      for (const i of tops) g += dot(xs(i), P.ys(data[i]), C.orange, 5);
      for (const i of bots) g += dot(xs(i), P.ys(data[i]), C.orange, 5);
      g += txt(x1 - 4, P.ys(res) - 8, 'Resistencia (techo): aquí aparecen vendedores', { anchor: 'end', size: 12.5, fill: C.ink, halo: true });
      g += txt(x1 - 4, P.ys(sup) + 18, 'Soporte (piso): aquí aparecen compradores', { anchor: 'end', size: 12.5, fill: C.ink, halo: true });
      return g;
    }
    const pivots = swings(data, 3, kind === 'up' ? 'min' : 'max');
    g += poly(data.map((v, i) => [xs(i), P.ys(v)]), C.blue, 2);
    const a = pivots[0], b = pivots.at(-1);
    const slope = (data[b] - data[a]) / (b - a);
    const ext = i => data[a] + slope * (i - a);
    g += line(xs(0), P.ys(ext(0)), xs(data.length - 1), P.ys(ext(data.length - 1)), C.orange, 2, { 'stroke-dasharray': '6 5' });
    for (const i of pivots) g += dot(xs(i), P.ys(data[i]), C.orange, 5.5);
    const i2 = pivots[Math.min(1, pivots.length - 1)];
    const lab = kind === 'up' ? 'Cada mínimo queda más arriba que el anterior' : 'Cada máximo queda más abajo que el anterior';
    g += txt(xs(i2) + 10, P.ys(data[i2]) + (kind === 'up' ? 22 : -14), lab, { size: 12.5, fill: C.ink, halo: true });
    return g;
  }, [{ k: 'line', c: C.blue, l: 'Precio' }, { k: 'dash', c: C.orange, l: kind === 'range' ? 'Soporte y resistencia' : (kind === 'up' ? 'Línea de tendencia por los mínimos' : 'Línea de tendencia por los máximos') }, { k: 'dot', c: C.orange, l: kind === 'range' ? 'Rebotes' : (kind === 'up' ? 'Mínimos crecientes' : 'Máximos decrecientes') }]);
}

fig('bollinger', 'Bandas de Bollinger: la base de este bot', 'Cuando el precio cierra por debajo de la banda inferior, la estrategia de reversión a la media compra.', 400, () => {
  const n = 20, data = BOLL;
  const mid = [], upB = [], loB = [], sig = [];
  for (let i = 0; i < data.length; i++) {
    if (i < n - 1) { mid.push(null); upB.push(null); loB.push(null); continue; }
    const w = data.slice(i - n + 1, i + 1), m = w.reduce((a, b) => a + b) / n;
    const s = Math.sqrt(w.reduce((a, b) => a + (b - m) ** 2, 0) / (n - 1));
    mid.push(m); upB.push(m + 2 * s); loB.push(m - 2 * s);
    if (data[i] < m - 2 * s && (!sig.length || i - sig.at(-1) > 2)) sig.push(i);
  }
  const all = data.concat(upB.filter(v => v), loB.filter(v => v));
  const x0 = 44, x1 = W - 8;
  const P = panel({ x0, x1, y0: 8, y1: 372, yMin: Math.min(...all), yMax: Math.max(...all) });
  const xs = sc(0, data.length - 1, x0 + 6, x1 - 6);
  const idx = [...data.keys()].filter(i => mid[i] !== null);
  const upPts = idx.map(i => [xs(i), P.ys(upB[i])]), loPts = idx.map(i => [xs(i), P.ys(loB[i])]);
  let g = P.g;
  g += S('path', { d: pathD(upPts.concat(loPts.slice().reverse())) + ' Z', fill: C.orange, opacity: 0.09 });
  g += poly(upPts, C.orange, 1.5) + poly(loPts, C.orange, 1.5);
  g += poly(idx.map(i => [xs(i), P.ys(mid[i])]), C.orange, 1.5, { 'stroke-dasharray': '6 5' });
  g += poly(data.map((v, i) => [xs(i), P.ys(v)]), C.blue, 2);
  g += line(xs(n - 1), 8, xs(n - 1), 372, C.axis, 1, { 'stroke-dasharray': '3 4' });
  g += txt(xs(n - 1) + 6, 22, 'Desde aquí hay 20 velas para calcular las bandas', { size: 12, fill: C.muted, halo: true });
  const deepest = sig.reduce((a, b) => data[b] < data[a] ? b : a, sig[0]);
  sig.forEach(i => {
    const x = xs(i), y = P.ys(data[i]) + 12;
    g += S('path', { d: `M${x} ${y} L${x - 7} ${y + 12} L${x + 7} ${y + 12} Z`, fill: C.up, stroke: C.surface, 'stroke-width': 2, 'stroke-linejoin': 'round' });
    if (i === deepest) {
      g += line(x, y + 16, x, y + 34, C.axis, 1);
      g += txt(x + 10, y + 48, 'Señal de compra: el precio cerró bajo la banda inferior', { size: 12.5, fill: C.ink, weight: 600, halo: true, anchor: 'end' });
    }
  });
  return g;
}, [{ k: 'line', c: C.blue, l: 'Precio' }, { k: 'line', c: C.orange, l: 'Bandas superior e inferior (media ± 2σ)' }, { k: 'dash', c: C.orange, l: 'Media de 20 velas' }, { k: 'tri', c: C.up, l: 'Señal de compra' }]);

// 16. Arquitectura del bot
function box(x, y, w, h, title, lines, o = {}) {
  let s = S('rect', { x, y, width: w, height: h, rx: 10, fill: o.fill || C.surface, stroke: o.stroke || C.axis, 'stroke-width': o.sw || 1.5 });
  if (o.accent) s += S('rect', { x: x + 1, y: y + 1, width: 5, height: h - 2, rx: 2, fill: o.accent });
  const cx = x + w / 2;
  const startY = y + h / 2 - (lines.length * 16) / 2 + 2;
  s += txt(cx, startY, title, { anchor: 'middle', size: o.tsize || 14.5, fill: C.ink, weight: 650 });
  lines.forEach((l, i) => s += txt(cx, startY + 19 + i * 16, l, { anchor: 'middle', size: 12, fill: C.ink2 }));
  return s;
}

// 19. Bandas que se adaptan a la volatilidad (documento de matemática)
fig('volatilidad-adaptativa', 'Cómo se adaptan las bandas cuando cambia la volatilidad', 'Media de 20 velas ± 2σ. En la vela 70 el mercado pasa de tranquilo a agitado: las bandas se abren solas, pero tardan unas 20 velas en ponerse al día.', 415, () => {
  const N = 130, n = 20, k = 2, jump = 70, phi = 0.85, sLo = 0.25, sHi = 1.4;
  const gv = gauss(rng(41)); const data = []; let p = 100;
  for (let i = 0; i < N; i++) { p += (1 - phi) * (100 - p) + (i < jump ? sLo : sHi) * gv(); data.push(p); }
  const mid = [], upB = [], loB = [], sd = [];
  for (let i = 0; i < N; i++) {
    if (i < n - 1) { mid.push(null); upB.push(null); loB.push(null); sd.push(null); continue; }
    const w = data.slice(i - n + 1, i + 1), m = w.reduce((a, b) => a + b) / n;
    const s = Math.sqrt(w.reduce((a, b) => a + (b - m) ** 2, 0) / (n - 1));
    mid.push(m); upB.push(m + k * s); loB.push(m - k * s); sd.push(s);
  }
  const idx = [...data.keys()].filter(i => mid[i] !== null);
  const all = data.concat(idx.map(i => upB[i]), idx.map(i => loB[i]));
  const x0 = 44, x1 = W - 8;
  const P = panel({ x0, x1, y0: 8, y1: 270, yMin: Math.min(...all), yMax: Math.max(...all) });
  const xs = sc(0, N - 1, x0 + 6, x1 - 6);
  // σ teórica de un proceso AR(1): s / √(1 − φ²)
  const real = s => s / Math.sqrt(1 - phi * phi);
  const S2 = panel({ x0, x1, y0: 298, y1: 384, yMin: 0, yMax: Math.max(real(sHi), ...idx.map(i => sd[i])), yTicks: 2, yFmt: v => num(v, 1) });
  let g = S('rect', { x: xs(jump), y: 2, width: xs(jump + n - 1) - xs(jump), height: 382, fill: C.yellow, opacity: 0.13 });
  g += P.g + S2.g;
  const upPts = idx.map(i => [xs(i), P.ys(upB[i])]), loPts = idx.map(i => [xs(i), P.ys(loB[i])]);
  g += S('path', { d: pathD(upPts.concat(loPts.slice().reverse())) + ' Z', fill: C.orange, opacity: 0.09 });
  g += poly(upPts, C.orange, 1.5) + poly(loPts, C.orange, 1.5);
  g += poly(idx.map(i => [xs(i), P.ys(mid[i])]), C.orange, 1.5, { 'stroke-dasharray': '6 5' });
  g += poly(data.map((v, i) => [xs(i), P.ys(v)]), C.blue, 2);
  idx.forEach(i => { if (data[i] < loB[i] || data[i] > upB[i]) g += dot(xs(i), P.ys(data[i]), C.red, 4.5); });
  g += line(xs(jump), 8, xs(jump), 384, C.ink2, 1, { 'stroke-dasharray': '3 4' });
  g += txt(xs(jump) - 8, 22, 'Mercado tranquilo', { anchor: 'end', size: 12.5, fill: C.ink, weight: 600, halo: true });
  g += txt(xs(jump + n - 1) + 8, 22, 'Mercado agitado', { size: 12.5, fill: C.ink, weight: 600, halo: true });
  g += txt((xs(jump) + xs(jump + n - 1)) / 2, P.ys(Math.min(...all)) - 4, 'Bandas atrasadas', { anchor: 'middle', size: 12, fill: C.ink, halo: true });
  const realPts = [[xs(n - 1), S2.ys(real(sLo))], [xs(jump), S2.ys(real(sLo))], [xs(jump), S2.ys(real(sHi))], [xs(N - 1), S2.ys(real(sHi))]];
  g += poly(realPts, C.ink2, 1.5, { 'stroke-dasharray': '5 4' });
  g += poly(idx.map(i => [xs(i), S2.ys(sd[i])]), C.violet, 2);
  g += txt(x0 + 6, 296, 'σ de la ventana', { size: 12, fill: C.muted });
  for (let v = 0; v < N; v += 20) g += txt(xs(v), 404, v === 0 ? 'vela 0' : String(v), { anchor: 'middle', fill: C.muted, tab: true });
  return g;
}, [{ k: 'line', c: C.blue, l: 'Precio' }, { k: 'line', c: C.orange, l: 'Bandas (media ± 2σ)' }, { k: 'dot', c: C.red, l: 'Precio fuera de las bandas (posible señal)' }, { k: 'line', c: C.violet, l: 'σ medida por el bot' }, { k: 'dash', c: C.ink2, l: 'σ real del mercado' }, { k: 'box', c: C.yellow, l: 'Las 20 velas que tarda en ponerse al día', o: 0.4 }]);

// ================= Figuras por fórmula (documento de matemática) =================
const xtick = (x, y, s, o = {}) => txt(x, y, s, { anchor: 'middle', fill: C.muted, tab: true, size: 11.5, ...o });
const hline = (x0, x1, y, color, o = {}) => line(x0, y, x1, y, color, o.w || 1.5, o.dash ? { 'stroke-dasharray': '6 5' } : {});
const label = (x, y, s, o = {}) => txt(x, y, s, { size: 12.5, fill: C.ink, halo: true, ...o });
function bracket(x, ya, yb, s, color, side = 'right') {
  const d = side === 'right' ? 7 : -7;
  return S('path', { d: `M${x} ${ya} H${x + d} V${yb} H${x}`, fill: 'none', stroke: color, 'stroke-width': 1.6, 'stroke-linejoin': 'round' })
    + txt(x + d * 1.8, (ya + yb) / 2 + 4, s, { anchor: side === 'right' ? 'start' : 'end', size: 12.5, fill: C.ink, weight: 600, halo: true });
}
// Panel gris con un cálculo paso a paso. rows: [texto, valor, opciones]
function calcPanel(cx, y, w, h, title, rows) {
  let g = S('rect', { x: cx, y, width: w, height: h, rx: 10, fill: '#f3f2ee' });
  g += txt(cx + 16, y + 26, title, { size: 13.5, fill: C.ink, weight: 650 });
  let yy = y + 30;
  for (const [a, b, o = {}] of rows) {
    yy += o.gap || 24;
    if (o.rule) { g += line(cx + 16, yy - 16, cx + w - 16, yy - 16, C.axis, 1); }
    g += txt(cx + 16, yy, a, { size: o.big ? 14 : 12.5, fill: o.big ? C.ink : C.ink2, weight: o.big ? 650 : undefined });
    if (b !== undefined) g += txt(cx + w - 16, yy, b, { anchor: 'end', size: o.big ? 16 : 13, fill: o.color || C.ink, tab: true, weight: o.big ? 700 : 600 });
  }
  return g;
}
// Camino suave entre puntos de control [[t, v], ...] con t en [0, 1].
function ctrlPath(ctrl, n, noise, seed) {
  const r = gauss(rng(seed)), out = [];
  for (let i = 0; i <= n; i++) {
    const t = i / n; let j = 0; while (j < ctrl.length - 2 && ctrl[j + 1][0] < t) j++;
    const [ta, va] = ctrl[j], [tb, vb] = ctrl[j + 1];
    const u = Math.min(1, Math.max(0, (t - ta) / (tb - ta))), s = (1 - Math.cos(Math.PI * u)) / 2;
    out.push(va + (vb - va) * s + (i > 0 && i < n ? noise * r() : 0));
  }
  return out;
}

  const N = 110, n = 20, k = 2, gq = gauss(rng(77)), data = []; let p = 100;
  for (let i = 0; i < N; i++) { const s = i < 45 ? 2.2 : i < 88 ? 0.22 : 0.9; p += 0.2 * (100 - p) * (i < 88 ? 1 : 0) + s * gq() + (i >= 88 ? 0.55 : 0); data.push(p); }
  const mid = [], up = [], lo = [], bw = [];
  for (let i = 0; i < N; i++) {
    if (i < n - 1) { mid.push(null); up.push(null); lo.push(null); bw.push(null); continue; }
    const w = data.slice(i - n + 1, i + 1), m = w.reduce((a, b) => a + b) / n, s = Math.sqrt(w.reduce((a, b) => a + (b - m) ** 2, 0) / (n - 1));
    mid.push(m); up.push(m + k * s); lo.push(m - k * s); bw.push(2 * k * s / m);
  }
  let armed = false, armAt = null, buy = null;
  for (let i = n - 1; i < N && buy === null; i++) { if (!armed && bw[i] < 0.05) { armed = true; armAt = i; } else if (armed && data[i] > up[i]) buy = i; }
  const idx = [...data.keys()].filter(i => mid[i] !== null);
  const x0 = 48, x1 = W - 8, xs = sc(0, N - 1, x0 + 4, x1 - 4);
  const all = data.concat(idx.map(i => up[i]), idx.map(i => lo[i]));
  const P = panel({ x0, x1, y0: 8, y1: 240, yMin: Math.min(...all), yMax: Math.max(...all), yTicks: 4 });
  const Q = panel({ x0, x1, y0: 266, y1: 372, yMin: 0, yMax: Math.max(...idx.map(i => bw[i])) * 100, yTicks: 3, yFmt: v => num(v) + ' %' });
  let g = '';
  if (armAt !== null) g += S('rect', { x: xs(armAt), y: 4, width: xs(buy ?? N - 1) - xs(armAt), height: 368, fill: C.yellow, opacity: 0.13 });
  g += P.g + Q.g;
  const upP = idx.map(i => [xs(i), P.ys(up[i])]), loP = idx.map(i => [xs(i), P.ys(lo[i])]);
  g += S('path', { d: pathD(upP.concat(loP.slice().reverse())) + ' Z', fill: C.orange, opacity: 0.09 }) + poly(upP, C.orange, 1.5) + poly(loP, C.orange, 1.5);
  g += poly(data.map((v, i) => [xs(i), P.ys(v)]), C.blue, 2);
  g += hline(x0, x1, Q.ys(5), C.red, { dash: true }) + label(x1 - 4, Q.ys(5) - 6, 'Umbral θ = 5 %', { anchor: 'end', size: 11.5, fill: C.red, weight: 600 });
  g += poly(idx.map(i => [xs(i), Q.ys(bw[i] * 100)]), C.violet, 2);
  if (armAt !== null) g += label(xs(armAt) + 6, 22, 'Armada: BW < 5 %', { size: 12, weight: 600 });
  if (buy !== null) {
    const x = xs(buy), y = P.ys(data[buy]) + 12;
    g += S('path', { d: `M${x} ${y} L${x - 7} ${y + 12} L${x + 7} ${y + 12} Z`, fill: C.up, stroke: C.surface, 'stroke-width': 2 });
    g += label(x - 10, y + 30, 'Compra: el precio rompe U', { anchor: 'end', weight: 600 });
  }
  g += txt(x0 + 6, 262, 'Ancho de banda BW = 2kσ / μ', { size: 12, fill: C.muted });
  return g;
}, [{ k: 'line', c: C.blue, l: 'Precio' }, { k: 'line', c: C.orange, l: 'Bandas' }, { k: 'line', c: C.violet, l: 'Ancho de banda' }, { k: 'box', c: C.yellow, l: 'Estrategia armada', o: 0.4 }, { k: 'tri', c: C.up, l: 'Compra' }]);

// §14 Búsqueda en rejilla
fig('f-rejilla', 'La búsqueda en rejilla prueba 276 combinaciones', 'Cada celda es un backtest completo con una ventana n y un multiplicador k. El color es el score (valores ilustrativos); se queda la celda más oscura.', 330, () => {
  const ns = [...Array(23).keys()].map(i => 8 + 4 * i), ks = [...Array(12).keys()].map(i => +(0.8 + 0.2 * i).toFixed(1));
  const gr = gauss(rng(55));
  const score = (n, k) => 40 * Math.exp(-(((n - 24) / 22) ** 2) - (((k - 1.8) / 0.7) ** 2)) + 6 * gr() - 5;
  const vals = ns.map(n => ks.map(k => score(n, k)));
  let best = [0, 0]; vals.forEach((r, i) => r.forEach((v, j) => { if (v > vals[best[0]][best[1]]) best = [i, j]; }));
  const lo = Math.min(...vals.flat()), hi = Math.max(...vals.flat());
  const x0 = 44, y0 = 8, cw = (W - 160 - x0) / 23, ch = 22;
  const col = v => { const t = (v - lo) / (hi - lo); const a = [235, 242, 252], b = [42, 120, 214]; return `rgb(${a.map((c, i) => Math.round(c + (b[i] - c) * t)).join(',')})`; };
  let g = '';
  vals.forEach((r, i) => r.forEach((v, j) => g += S('rect', { x: x0 + i * cw, y: y0 + (11 - j) * ch, width: cw - 1.5, height: ch - 1.5, rx: 2, fill: col(v) })));
  g += S('rect', { x: x0 + best[0] * cw - 1, y: y0 + (11 - best[1]) * ch - 1, width: cw + 0.5, height: ch + 0.5, rx: 3, fill: 'none', stroke: C.ink, 'stroke-width': 2.5 });
  ks.forEach((k, j) => { if (j % 2 === 0) g += txt(x0 - 8, y0 + (11 - j) * ch + 15, num(k, 1), { anchor: 'end', fill: C.muted, size: 11.5 }); });
  ns.forEach((n, i) => { if (i % 2 === 0) g += xtick(x0 + i * cw + cw / 2, y0 + 12 * ch + 16, String(n)); });
  g += txt(x0 + 11.5 * cw, y0 + 12 * ch + 36, 'Ventana n (velas)', { anchor: 'middle', size: 12, fill: C.ink2 });
  g += txt(12, y0 + 6 * ch, 'k', { anchor: 'middle', size: 13, fill: C.ink2, weight: 600 });
  const lx = W - 140;
  g += label(lx, y0 + (11 - best[1]) * ch + 15, `Mejor: n = ${ns[best[0]]}, k = ${num(ks[best[1]], 1)}`, { weight: 650 });
  g += txt(lx, y0 + (11 - best[1]) * ch + 34, '(n*, k*) = argmax Score', { size: 11.5, fill: C.ink2 });
  for (let t = 0; t <= 4; t++) g += S('rect', { x: lx + t * 26, y: 240, width: 25, height: 14, fill: col(lo + (hi - lo) * t / 4) });
  g += txt(lx, 270, 'score bajo', { size: 11, fill: C.muted }) + txt(lx + 130, 270, 'alto', { anchor: 'end', size: 11, fill: C.muted });
  return g;
});

// Sugerencia 1: razón de varianzas
fig('f-vr', 'Tres formas en que se mueve un precio', 'Tres caminos simulados con la misma volatilidad por vela. Lo que cambia es si cada movimiento tiende a deshacer el anterior, es independiente o lo repite.', 260, () => {
  // Oscila: precio que vuelve a su centro. Aleatorio: paseo al azar. Persiste: retornos que se repiten.
  const mk = (kind, seed) => { const gz = gauss(rng(seed)); let r = 0, p = 0; const out = [0]; for (let i = 0; i < 120; i++) { const e = gz(); if (kind < 0) p = 0.55 * p + e; else { r = kind * r + e; p += r; } out.push(p); } return out; };
  const cases = [[-1, 12, 'Oscila', 'VR < 1 → reversión a la media', C.aqua], [0, 12, 'Aleatorio', 'VR ≈ 1 → no operar', C.ink2], [0.8, 12, 'Persiste', 'VR > 1 → seguir la tendencia', C.violet]];
  const pw = (W - 2 * 28) / 3;
  let g = '';
  cases.forEach(([phi, seed, t, d, c], j) => {
    const data = mk(phi, seed), x0 = j * (pw + 28), x1 = x0 + pw;
    const lo = Math.min(...data), hi = Math.max(...data), ys = sc(lo, hi, 200, 50), xs = sc(0, data.length - 1, x0, x1);
    g += txt(x0, 14, t, { size: 13.5, fill: C.ink, weight: 650 }) + txt(x0, 32, d, { size: 12, fill: c, weight: 600 });
    g += line(x0, 210, x1, 210, C.axis, 1) + poly(data.map((v, i) => [xs(i), ys(v)]), c, 2);
  });
  g += txt(0, 240, 'VR(q) compara la varianza de q velas juntas con q veces la de una vela. Ejemplo: 2.8 / (4 × 1) = 0.7 → oscila.', { size: 12, fill: C.ink2 });
  return g;
});

// Sugerencia 3: Chandelier exit
fig('f-chandelier', 'Stop dinámico con ATR (Chandelier exit)', 'El stop va 3 ATR por debajo del máximo alcanzado. Sube con la tendencia, nunca baja, y cierra la operación cuando el precio lo cruza.', 300, () => {
  const path = ctrlPath([[0, 2400], [0.55, 2520], [0.7, 2505], [0.85, 2470], [1, 2440]], 48, 7, 52);
  const K = []; for (let i = 0; i < 24; i++) { const seg = path.slice(i * 2, i * 2 + 3); K.push({ o: seg[0], c: seg[2], h: Math.max(...seg) + 4, l: Math.min(...seg) - 4 }); }
  const tr = K.map((k, i) => i ? Math.max(k.h - k.l, Math.abs(k.h - K[i - 1].c), Math.abs(k.l - K[i - 1].c)) : k.h - k.l);
  const atr = tr.map((_, i) => { const w = tr.slice(Math.max(0, i - 4), i + 1); return w.reduce((a, b) => a + b) / w.length; });
  let mx = -Infinity, exit = null; const stop = K.map((k, i) => { mx = Math.max(mx, k.h); return mx - 3 * atr[i]; });
  for (let i = 1; i < K.length; i++) { const st = Math.max(...stop.slice(0, i)); if (K[i].c < st) { exit = i; break; } }
  const stopUp = stop.map((s, i) => Math.max(...stop.slice(0, i + 1)));
  const x0 = 56, x1 = W - 8, slot = (x1 - x0) / K.length, xs = i => x0 + slot * (i + 0.5);
  const P = panel({ x0, x1, y0: 8, y1: 262, yMin: Math.min(...K.map(k => k.l), ...stopUp) - 5, yMax: Math.max(...K.map(k => k.h)) + 5, yTicks: 5 });
  let g = P.g + candles(K, xs, P.ys, slot * 0.55);
  const last = exit ?? K.length - 1;
  const sp = []; for (let i = 0; i <= last; i++) { if (i) sp.push([xs(i) - slot / 2, P.ys(stopUp[i - 1])]); sp.push([xs(i) - slot / 2, P.ys(stopUp[i])], [xs(i) + slot / 2, P.ys(stopUp[i])]); }
  g += poly(sp, C.orange, 2.5);
  if (exit !== null) g += S('circle', { cx: xs(exit), cy: P.ys(K[exit].c), r: 9, fill: 'none', stroke: C.ink, 'stroke-width': 2 }) + label(xs(exit) - 14, P.ys(K[exit].c) + 30, 'cierra bajo el stop: salida', { anchor: 'end', weight: 650 });
  const im = K.reduce((a, k, i) => k.h > K[a].h ? i : a, 0);
  g += label(xs(im), P.ys(K[im].h) - 10, 'máximo', { anchor: 'middle', size: 12, fill: C.ink2 });
  g += label(xs(2), P.ys(stopUp[2]) + 18, 'SL = máximo − 3 × ATR', { size: 12, fill: C.orange, weight: 650 });
  return g;
}, [{ k: 'box', c: C.up, l: 'Vela alcista' }, { k: 'box', c: C.down, l: 'Vela bajista' }, { k: 'line', c: C.orange, l: 'Stop dinámico' }]);

// §25 EWMA frente a ventana
fig('f-ewma', 'Ventana de 20 velas frente a EWMA', 'La volatilidad real salta de 1 % a 3 % en la vela 40. Con λ = 0.94 la EWMA reacciona casi igual que la ventana de 20 velas; con λ = 0.80 se pone al día en pocas velas, a cambio de ser más ruidosa.', 290, () => {
  const N = 90, jump = 40, gz = gauss(rng(66)), r = [];
  for (let i = 0; i < N; i++) r.push((i < jump ? 1 : 3) * gz());
  const win = r.map((_, i) => { if (i < 19) return null; const w = r.slice(i - 19, i + 1); return Math.sqrt(w.reduce((a, b) => a + b * b, 0) / 20); });
  const ewma = lam => { let v = 1; return r.map(x => (v = lam * v + (1 - lam) * x * x, Math.sqrt(v))); };
  const ew = ewma(0.94), ew8 = ewma(0.8);
  const x0 = 56, x1 = W - 8, xs = sc(0, N - 1, x0 + 4, x1 - 4);
  const P = panel({ x0, x1, y0: 8, y1: 250, yMin: 0, yMax: 5, fixed: true, yTicks: 5, yFmt: x => num(x) + ' %' });
  let g = S('rect', { x: xs(jump), y: 8, width: xs(jump + 19) - xs(jump), height: 242, fill: C.yellow, opacity: 0.12 }) + P.g;
  g += poly([[xs(0), P.ys(1)], [xs(jump), P.ys(1)], [xs(jump), P.ys(3)], [xs(N - 1), P.ys(3)]], C.ink2, 1.5, { 'stroke-dasharray': '5 4' });
  g += poly(win.map((x, i) => x === null ? null : [xs(i), P.ys(x)]).filter(Boolean), C.violet, 2.5);
  g += poly(ew8.map((x, i) => [xs(i), P.ys(x)]), C.aqua, 1.8) + poly(ew.map((x, i) => [xs(i), P.ys(x)]), C.orange, 2.5);
  for (let i = 0; i < N; i += 10) g += xtick(xs(i), 270, i ? String(i) : 'vela 0');
  g += label(xs(jump) + 6, 24, 'la ventana se pone al día', { size: 12, weight: 600 });
  return g;
}, [{ k: 'dash', c: C.ink2, l: 'Volatilidad real' }, { k: 'line', c: C.violet, l: 'σ de la ventana (20 velas)' }, { k: 'line', c: C.orange, l: 'σ EWMA (λ = 0.94)' }, { k: 'line', c: C.aqua, l: 'σ EWMA (λ = 0.80)' }, { k: 'box', c: C.yellow, l: '20 velas después del salto', o: 0.4 }]);

    g += dot(xs(n), P.ys(v), C.violet, 5) + label(xs(n) + 6 * side, P.ys(v) + 18, `${s}: ${num(v, 2)} vs ${num(Math.sqrt(n), 2)}`, { size: 11.5, anchor: side < 0 ? 'end' : 'start' });
  });
  for (let n = 0; n <= 100; n += 20) g += xtick(xs(n), 270, `n = ${n}`);
  return g;
}, [{ k: 'line', c: C.violet, l: 'σ medida por la ventana' }, { k: 'dash', c: C.ink2, l: 'Movimiento típico en n velas' }]);

// §25.5 Fotos de cada ~6 s frente a velas cerradas de 15 minutos

}, [{ k: 'dot', c: C.muted, l: 'Foto de la vela en curso (hoy, cada ~6 s)' }, { k: 'dot', c: C.violet, l: 'Cierre de la vela de 15 min (propuesta)' }]);

// 20. Recorrido matemático completo (documento de matemática)
// Fórmulas con mini-marcado: _x o _{xy} = subíndice, ^x o ^{xy} = superíndice.
const MATH_FONT = 'Cambria Math, Cambria, &quot;Times New Roman&quot;, serif';
function fxMarkup(s) {
  return s.replace(/([_^])(\{([^}]*)\}|(.))/g, (m, op, _g, grp, ch) =>
    `<tspan baseline-shift="${op === '_' ? 'sub' : 'super'}" font-size="72%">${grp ?? ch}</tspan>`);
}
function stepBox(x, y, w, h, o) {
  const accent = o.accent || C.violet;
  let s = S('rect', { x, y, width: w, height: h, rx: 10, fill: C.surface, stroke: o.dashed ? C.muted : C.axis, 'stroke-width': 1.5, 'stroke-dasharray': o.dashed ? '5 4' : undefined });
  if (!o.dashed) s += S('rect', { x: x + 1, y: y + 1, width: 5, height: h - 2, rx: 2, fill: accent });
  const px = x + 16;
  const bwid = 12 + 7.5 * o.num.length;
  s += S('rect', { x: px, y: y + 10, width: bwid, height: 18, rx: 9, fill: accent, opacity: 0.16 });
  s += txt(px + bwid / 2, y + 23, o.num, { anchor: 'middle', size: 11.5, fill: C.ink, weight: 700 });
  s += txt(px + bwid + 6, y + 23, o.title, { size: 13, fill: C.ink, weight: 650 });
  if (o.sec) s += txt(x + w - 10, y + 23, o.sec, { anchor: 'end', size: 11, fill: C.muted });
  let yy = y + 30;
  for (const it of o.items || []) {
    if (it.fx) {
      yy += 21;
      s += S('text', { x: px, y: yy, 'font-size': it.size || 15, fill: C.ink, 'font-family': MATH_FONT }, fxMarkup(it.fx));
    } else {
      yy += it.gap || 16;
      s += txt(px, yy, it.raw ? it.p : fxMarkup(it.p), { size: 11.5, fill: C.ink2 });
    }
  }
  if (o.foot) s += txt(px, y + h - 11, o.foot, { size: 11.5, fill: C.red, weight: 600 });
  return s;
}
fig('recorrido', 'El recorrido matemático del bot, paso a paso', 'Arriba, lo que se calcula una sola vez antes de operar. Abajo, lo que se calcula cada vez que llega un precio. Cada caja indica la sección de este documento que explica su fórmula.', 712, () => {
  let g = arrowDefs();
  const PY = C.violet, NODE = C.blue;
  const head = (y, s) => txt(0, y, s, { size: 13, fill: C.ink, weight: 700 });
  // --- Fase A: fuera de línea ---
  g += head(12, 'A · Antes de operar: aprender de la historia (una vez, al arrancar server.py)');
  const aw = 160, ag = (W - 5 * aw) / 4, ay = 26, ah = 112;
  const ax = i => i * (aw + ag);
  const A = [
    { num: 'A1', title: 'Datos', sec: 'Parte 4', accent: C.yellow, items: [{ p: 'Velas de 15 minutos', gap: 22 }, { p: 'desde 2023; se usa' }, { p: 'el último mes (~2 880)' }] },
    { num: 'A2', title: 'Backtest', sec: '§12', items: [{ fx: 'C ← C + 30 | C − 15', size: 13.5 }, { p: 'Repite los pasos B2 a B7', gap: 20 }, { p: 'para cada pareja (n, k)' }] },
    { num: 'A3', title: 'Métricas', sec: '§13', items: [{ fx: 'Score = PnL − 10·MDD', size: 13.5 }, { p: 'También WR, PF, EP', gap: 20 }, { p: 'y drawdown' }] },
    { num: 'A4', title: 'Mejor (n, k)', sec: '§14', items: [{ fx: 'argmax Score(n, k)', size: 13.5 }, { p: '~276 pruebas por', gap: 20 }, { p: 'estrategia y moneda' }] },
    { num: 'A5', title: 'Estrategia', sec: '§14', items: [{ fx: 'argmax PnL', size: 13.5 }, { p: 'Una por moneda, guardada', gap: 20 }, { p: 'en ml_results.json', raw: true }] },
  ];
  A.forEach((b, i) => {
    g += stepBox(ax(i), ay, aw, ah, b);
    if (i < A.length - 1) g += arrow([[ax(i) + aw + 3, ay + ah / 2], [ax(i + 1) - 4, ay + ah / 2]]);
  });
  // XGBoost: se entrena pero no participa
  const xy = ay + ah + 14;
  g += S('rect', { x: 0, y: xy, width: 2 * aw + ag, height: 26, rx: 13, fill: 'none', stroke: C.muted, 'stroke-width': 1.2, 'stroke-dasharray': '5 4' });
  g += txt(14, xy + 17.5, 'XGBoost (§15–18) se entrena con A1, pero no se usa en vivo', { size: 11.5, fill: C.muted });
  // --- Fase B: en vivo ---
  const hy = 206;
  g += head(hy, 'B · En vivo: con cada precio que llega');
  const bw = 204, bg = (W - 4 * bw) / 3, bh = 124, rowGap = 44, by0 = 232;
  const bx = c => c * (bw + bg), by = r => by0 + r * (bh + rowGap);
  // Conexión A5 → pasos 2 y 5 (n* y k*)
  const yR = hy + 12;
  g += S('path', { d: `M${ax(4) + aw / 2} ${ay + ah + 4} V${yR} H${bx(1) + bw / 2} V${by(0) - 6}`, fill: 'none', stroke: C.ink2, 'stroke-width': 1.5, 'stroke-dasharray': '5 4', 'marker-end': 'url(#ah)' });
  g += txt(ax(4) + aw / 2 - 10, yR - 6, 'n*, k* y la estrategia de cada moneda', { anchor: 'end', size: 11.5, fill: C.ink2, halo: true });
  const B = [
    { num: 'B1', title: 'Llega un precio', sec: '§22', accent: NODE, items: [{ fx: 'P_t' }, { p: 'Foto de la vela de 1 min,', gap: 20 }, { p: 'cada ~6 s (Node → Python)' }] },
    { num: 'B2', title: 'Ventana deslizante', sec: '§1', items: [{ fx: 'P_{t−n+1} … P_t' }, { p: 'Entra P_t y sale el más viejo;', gap: 20 }, { p: 'n viene de A4' }] },
    { num: 'B3', title: 'Media móvil', sec: '§1', items: [{ fx: 'μ = (1/n) · Σ P_i' }, { p: 'El precio "normal"', gap: 20 }, { p: 'de la ventana' }] },
    { num: 'B4', title: 'Desviación estándar', sec: '§2', items: [{ fx: 'σ = √[ Σ(P_i − μ)² / (n − 1) ]', size: 14 }, { p: 'La volatilidad reciente,', gap: 20 }, { p: 'en USDT' }] },
    { num: 'B5', title: 'Bandas y z-score', sec: '§3 · §23', items: [{ fx: 'U, L = μ ± k·σ' }, { fx: 'z = (P_t − μ) / σ' }, { p: 'k viene de A4', gap: 18 }] },
    { num: 'B6', title: '¿Hay señal?', sec: '§5–8', foot: 'No → HOLD, volver a B1', items: [{ p: 'Reversión:  P_t < L  (z < −k)', gap: 18 }, { p: 'Ruptura:  P_t > U  (z > k)' }, { p: 'Squeeze:  BW < 5 % y P_t > U' }] },
    { num: 'B7', title: 'Riesgo, TP y SL', sec: '§4–8 · §24', items: [{ fx: 'R = |P_t − μ|' }, { p: 'Reversión: TP = μ, SL = P − R', gap: 20 }, { p: 'Ruptura: SL = μ, TP = P + 2R' }, { p: 'Squeeze: SL = μ, TP = P + 2.5R' }] },
    { num: 'B8', title: 'Riesgo mínimo', sec: '§5 · §24', foot: 'No → HOLD, volver a B1', items: [{ fx: 'R ≥ 0.005 · P_t' }, { p: 'Reversión, VWAP y squeeze;', gap: 20 }, { p: 'la ruptura no lo aplica' }] },
    { num: 'B9', title: 'Tamaño de posición', sec: '§10', accent: NODE, items: [{ fx: 'q = ⌊(15 / P_t)·10^d⌋ / 10^d', size: 14 }, { p: 'Unos 15 USDT por operación;', gap: 20 }, { p: 'orden de compra a Binance' }] },
    { num: 'B10', title: 'Vigilar la posición', sec: '§11', accent: NODE, items: [{ fx: 'P_t ≥ TP  o  P_t ≤ SL' }, { p: 'Se revisa con cada precio;', gap: 20 }, { p: 'no se buscan señales nuevas' }] },
    { num: 'B11', title: 'Resultado', sec: '§11', accent: NODE, items: [{ fx: 'PnL = (P_{sal} − P_{ent}) · q', size: 14 }, { p: 'Orden de venta; no descuenta', gap: 20 }, { p: 'comisiones (~0.2 %)' }] },
    { num: 'B12', title: 'Registro y aviso', accent: C.aqua, items: [{ p: 'Python anota la operación', gap: 24 }, { p: 'en trades.csv y Node avisa' }, { p: 'por Telegram.' }, { p: 'Vuelve a B1.', gap: 20 }] },
  ];
  B.forEach((b, i) => {
    const r = Math.floor(i / 4), c = i % 4, x = bx(c), y = by(r);
    g += stepBox(x, y, bw, bh, b);
    if (c < 3) {
      g += arrow([[x + bw + 3, y + bh / 2], [bx(c + 1) - 4, y + bh / 2]]);
      if (i === 5) g += txt(x + bw + bg / 2, y + bh / 2 - 7, 'sí', { anchor: 'middle', size: 12, fill: C.ink, weight: 600 });
    } else if (r < 2) {
      const yM = y + bh + rowGap / 2;
      g += arrow([[x + bw / 2, y + bh + 3], [x + bw / 2, yM], [bx(0) + bw / 2, yM], [bx(0) + bw / 2, by(r + 1) - 4]]);
      if (i === 7) g += txt(x + bw / 2 - 8, yM - 6, 'sí', { anchor: 'end', size: 12, fill: C.ink, weight: 600, halo: true });
    }
  });
  return g;
}, [{ k: 'box', c: C.violet, l: 'Python (binance-research/)' }, { k: 'box', c: C.blue, l: 'Node.js (src/)' }, { k: 'box', c: C.yellow, l: 'Datos de Binance' }, { k: 'box', c: C.aqua, l: 'Python y Node.js' }, { k: 'dash', c: C.ink2, l: 'Parámetros que pasan de A a B' }]);

// ---------- montaje ----------
const params = new URLSearchParams(location.search);
const only = params.get('only');
if (only || params.has('measure')) document.body.classList.add('shot');
const app = document.getElementById('app');
const keyHTML = it => {
  const style = it.k === 'tri' ? `border-bottom-color:${it.c}` : (it.k === 'line' || it.k === 'dash') ? `border-top-color:${it.c}` : `background:${it.c};opacity:${it.o || 1}`;
  return `<span><i class="k-${it.k}" style="${style}"></i>${it.l}</span>`;
};
for (const f of FIGS) {
  if (only && f.id !== only) continue;
  const el = document.createElement('figure');
  el.id = f.id;
  el.innerHTML = `<h2>${f.title}</h2><p class="sub">${f.sub}</p>`
    + `<svg viewBox="0 -4 ${W} ${f.h + 8}" role="img" aria-label="${f.title}">${f.render()}</svg>`
    + (f.legend.length ? `<div class="legend">${f.legend.map(keyHTML).join('')}</div>` : '')
    + (f.note ? `<div class="note">${f.note}</div>` : '');
  app.appendChild(el);
}
if (params.has('measure')) {
  const out = {};
  document.querySelectorAll('figure').forEach(f => out[f.id] = Math.ceil(f.getBoundingClientRect().height));
  const m = document.getElementById('measure');
  m.hidden = false; m.textContent = 'HEIGHTS' + JSON.stringify(out) + 'END';
}
